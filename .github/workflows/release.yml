# Automated desktop releases for Windows, macOS, and Linux.
#
# Triggers:
#   - Push of a version tag (v1.0.0, v1.0.1, …)
#   - Manual workflow_dispatch
#
# Publishes a GitHub Release on this same repo with installers + update feeds
# (latest.yml / latest-mac.yml / latest-linux.yml) so electron-updater works.
#
# Mac signing/notarization runs when MAC_CERT_* and APPLE_API_* secrets exist;
# otherwise macOS artifacts are produced unsigned so a first public release
# can still ship.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to release (defaults to the branch this runs from)"
        required: false
        type: string
      publish:
        description: "Publish the GitHub Release (uncheck to leave a draft)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Pin the release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      version: ${{ steps.pin.outputs.version }}
      tag: ${{ steps.pin.outputs.tag }}
      publish: ${{ steps.pin.outputs.publish }}
      sign_mac: ${{ steps.secrets.outputs.sign_mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: pin
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            # Tag must match package.json, otherwise updater metadata lies.
            if [ "${GITHUB_REF_NAME}" != "$tag" ]; then
              echo "::error::Pushed tag ${GITHUB_REF_NAME} does not match package.json version $tag"
              exit 1
            fi
          else
            echo "publish=${INPUT_PUBLISH:-true}" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing OpenFolks $version from $sha"
      - id: secrets
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ] && [ -n "$MAC_CERT_PASSWORD" ] \
            && [ -n "$APPLE_API_KEY_P8_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] \
            && [ -n "$APPLE_API_ISSUER_ID" ]; then
            echo "sign_mac=true" >> "$GITHUB_OUTPUT"
            echo "macOS artifacts will be signed and notarized"
          else
            echo "sign_mac=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Mac signing/notarization secrets are missing — shipping unsigned macOS builds"
          fi
      - name: Refuse to overwrite a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$TAG is already published — bump package.json version first"
            exit 1
          fi

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release
      - run: pnpm package:win
      - name: Verify packaged tree and start packaged server
        shell: bash
        run: |
          res=release/win-unpacked/resources
          [ -f "$res/server/index.js" ] || { echo "::error::missing server/index.js"; exit 1; }
          [ -f "$res/ui/index.html" ] || { echo "::error::missing ui/index.html"; exit 1; }
          [ -f "$res/cloudflared/cloudflared.exe" ] || { echo "::error::missing cloudflared.exe"; exit 1; }
          [ -f "$res/licenses/cloudflared-LICENSE.txt" ] || { echo "::error::missing cloudflared license"; exit 1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing app-update.yml"; exit 1; }
          grep -q "owner: manasdutta04" "$res/app-update.yml" || { echo "::error::wrong update owner"; exit 1; }
          grep -q "repo: openfolks" "$res/app-update.yml" || { echo "::error::wrong update repo"; exit 1; }
          if grep -q "publisherName" "$res/app-update.yml"; then
            echo "::error::publisherName on an unsigned build breaks every update"; exit 1
          fi
          HOME="$RUNNER_TEMP/smoke" USERPROFILE="$RUNNER_TEMP/smoke" OMB_PORT=21987 \
            node "$res/server/index.js" > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:21987/api/health >/dev/null 2>&1 && { kill $pid; exit 0; }
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          echo "::error::the packaged server never served /api/health"
          cat "$RUNNER_TEMP/server.log" || true
          exit 1
      - name: Stable-named copy
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/OpenFolks-$v-setup.exe" release/OpenFolks-setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Ubuntu 24.04 x64
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation and native smoke tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          at-spi2-core dbus-x11 desktop-file-utils libxi6 libxkbcommon0 squashfs-tools x11-utils xdotool xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm clean
      - run: pnpm build:cua:linux
      - name: Prove overlay-free X11 input routing
        run: dbus-run-session -- xvfb-run -a pnpm smoke:cua-x11-input
      - run: pnpm package:linux:offline
      - run: node scripts/verify-linux-package.mjs
      - name: Match a normal Ubuntu package parent
        run: |
          test ! -L /opt
          test "$(stat -c '%F %U:%G' /opt)" = "directory root:root"
          case "$(stat -c '%a' /opt)" in
            755) ;;
            775|777) sudo chmod 0755 /opt ;;
            *) echo "Unexpected /opt mode: $(stat -c '%a' /opt)" >&2; exit 1 ;;
          esac
      - name: Verify in-place DEB upgrade
        run: |
          deb=(release/*.deb)
          test "${#deb[@]}" -eq 1
          sudo --preserve-env=CI,RUNNER_TEMP node scripts/smoke-deb-upgrade.mjs "${deb[0]}"
      - name: Configure Chromium sandbox
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: Smoke the packages
        env:
          OMB_KEEP_SMOKE_DIR: "1"
          OMB_SMOKE_INSTALLED_DEB: "1"
        run: pnpm smoke:linux-package
      - if: always()
        run: sudo dpkg --purge openfolks || true
      - name: Stable-named copies and checksums
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/OpenFolks-$v-amd64.deb" release/OpenFolks-amd64.deb
          cp "release/OpenFolks-$v-x86_64.AppImage" release/OpenFolks.AppImage
          chmod 0755 release/OpenFolks.AppImage
          (cd release && sha256sum OpenFolks-$v-amd64.deb OpenFolks-$v-x86_64.AppImage OpenFolks-amd64.deb OpenFolks.AppImage > SHA256SUMS-ubuntu-x64.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-ubuntu-x64.txt
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  mac:
    name: macOS arm64 + x64
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rm -rf dist dist-server dist-native release

      - name: Import Developer ID certificate
        if: needs.prepare.outputs.sign_mac == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Package both architectures
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ needs.prepare.outputs.sign_mac == 'true' && 'true' || 'false' }}
        run: pnpm package:mac

      - name: Verify signature before notarization
        if: needs.prepare.outputs.sign_mac == 'true'
        run: |
          for app in release/mac-arm64/OpenFolks.app release/mac/OpenFolks.app; do
            codesign --verify --deep --strict "$app"
            echo "ok: $app"
          done

      - name: Gate packaged servers
        run: |
          for app in release/mac-arm64/OpenFolks.app release/mac/OpenFolks.app; do
            res="$app/Contents/Resources"
            OMB_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
          done

      - name: Notarize artifacts
        if: needs.prepare.outputs.sign_mac == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          for f in release/*.dmg release/*.zip; do
            out=$(xcrun notarytool submit "$f" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait 2>&1)
            echo "$out" | tail -2
            echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization not Accepted for $f"; exit 1; }
          done
          rm "$RUNNER_TEMP/notary.p8"

      - name: Staple and refresh feeds
        if: needs.prepare.outputs.sign_mac == 'true'
        run: |
          xcrun stapler staple release/OpenFolks-*-arm64.dmg
          xcrun stapler staple release/OpenFolks-*-x64.dmg
          xcrun stapler staple release/mac-arm64/OpenFolks.app
          xcrun stapler staple release/mac/OpenFolks.app
          v=$(node -p "require('./package.json').version")
          rm -f "release/OpenFolks-$v-arm64.zip" "release/OpenFolks-$v-x64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/OpenFolks.app "release/OpenFolks-$v-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent release/mac/OpenFolks.app "release/OpenFolks-$v-x64.zip"
          node scripts/regenerate-blockmaps.mjs \
            "release/OpenFolks-$v-arm64.zip" "release/OpenFolks-$v-x64.zip" \
            "release/OpenFolks-$v-arm64.dmg" "release/OpenFolks-$v-x64.dmg"
          node scripts/regenerate-mac-feed.mjs

      - name: Stable-named copies
        run: |
          v=$(node -p "require('./package.json').version")
          cp "release/OpenFolks-$v-arm64.dmg" release/OpenFolks.dmg
          cp "release/OpenFolks-$v-x64.dmg" release/OpenFolks-intel.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Publish GitHub Release
    needs: [prepare, windows, linux, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Verify feed hashes
        run: |
          cd assets
          node --input-type=module - <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync, statSync, existsSync } from "node:fs";
          const sha512 = (f) => createHash("sha512").update(readFileSync(f)).digest("base64");
          let bad = 0;
          for (const feed of ["latest-mac.yml", "latest.yml", "latest-linux.yml"]) {
            if (!existsSync(feed)) {
              console.warn(`missing optional feed ${feed}`);
              continue;
            }
            const text = readFileSync(feed, "utf8");
            for (const [, url, hash, size] of text.matchAll(/url:\s+(\S+)[\s\S]*?sha512:\s+(\S+)\n\s+size:\s+(\d+)/g)) {
              if (!existsSync(url)) { console.error(`MISSING ${url} (listed in ${feed})`); bad++; continue; }
              const okHash = sha512(url) === hash;
              const okSize = statSync(url).size === Number(size);
              if (!okHash || !okSize) { console.error(`MISMATCH ${url} in ${feed}`); bad++; }
              else console.log(`ok ${url}`);
            }
          }
          if (bad) process.exit(1);
          console.log(`all feeds verified; ${readdirSync(".").length} assets staged`);
          EOF
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          cd assets
          notes="$(cat <<EOF
          ## OpenFolks ${VERSION}

          First public desktop build with automated multi-platform packaging.

          ### Downloads
          - **Windows:** \`OpenFolks-setup.exe\`
          - **macOS Apple silicon:** \`OpenFolks.dmg\`
          - **macOS Intel:** \`OpenFolks-intel.dmg\`
          - **Linux:** \`OpenFolks-amd64.deb\` / \`OpenFolks.AppImage\`

          Built from \`${SHA}\`.
          EOF
          )"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            args=(--title "OpenFolks ${VERSION}" --notes "$notes")
            if [ "$PUBLISH" != "true" ]; then
              args+=(--draft)
            fi
            gh release create "$TAG" "${args[@]}"
          fi
          for f in *; do
            gh release upload "$TAG" "$f" --clobber
          done
          if [ "$PUBLISH" = "true" ]; then
            gh release edit "$TAG" --draft=false --latest
            gh release view "$TAG" --json isDraft --jq .isDraft | grep -q false
            echo "$TAG is live"
          else
            echo "$TAG left as a draft"
          fi
          echo "asset count: $(gh release view "$TAG" --json assets --jq '.assets | length')"
